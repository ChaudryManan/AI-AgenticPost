# ─────────────────────────────────────────────────────────────────────
# Which model handles which node.
# Every node calls  LLMClient.json(node_name, ...)  and this file decides
# the provider/model/temperature.  Swap providers per node freely.
#
# Supported providers: openai | anthropic | gemini
# ─────────────────────────────────────────────────────────────────────
llm:
  default:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    fallback:
      - "poolside/laguna-s-2.1:free"
      - "google/gemma-4-31b-it:free"
    temperature: 0.6

  # everything else stays as-is
  planner:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.3
  research:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.2
  strategy:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.7
  script:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.7
  storyboard:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.5
  characters:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.4
  scene_prompts:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.6
  caption_writer:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.7
  copywriter:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.8
  scorer:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.1
  platform_format:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.5
  hashtags:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.5
  slide_splitter:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.4
  fact_check:
    provider: openrouter
    model: "cohere/north-mini-code:free"
    temperature: 0.0
