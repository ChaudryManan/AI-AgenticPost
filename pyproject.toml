[project]
name = "smauto"
version = "0.1.0"
description = "Social media automation graph (video + text) built on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # graph
  "langgraph>=0.2.30",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-core>=0.3.0",
  "huggingface_hub>=0.27",

  # models / settings
  "pydantic>=2.7",
  "pydantic-settings>=2.3",

  # api
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",

  # http / templating / parsing
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",

  # storage / db
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",

  # queue
  "celery[redis]>=5.4",
  "redis>=5.0",

  # reliability / observability
  "tenacity>=8.3",
  "structlog>=24.1",

  # media
  "Pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
smauto = "smauto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smauto"]
include = [
  "src/smauto/**/*.py",
  "src/smauto/**/*.j2",
  "src/smauto/**/*.yaml",
  "src/smauto/**/*.txt",
]

[tool.hatch.build.targets.sdist]
include = ["src/smauto", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]   # FastAPI Depends() default args

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true